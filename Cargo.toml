[package]
name = "abcsmc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lints.clippy]
needless_range_loop = "allow"

[lints.rust]
mismatched_lifetime_syntaxes = "allow"

[dependencies]
rand = "0.10.3"
rand_distr = "0.6.0"
indicatif = "0.18.6"
rayon = "1.10"
# Densities only; sampling comes from rand_distr. No rand or nalgebra pulled in.
statrs = { version = "0.19", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
# Deserialize RealPrior/IntPrior directly from type-tagged distribution
# documents (e.g. `{ "type": "Uniform", "a": 1.0, "b": 3.5 }`), so configs can
# declare priors without code-level wrappers.
serde = ["dep:serde"]

[dev-dependencies]
csv = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 3
