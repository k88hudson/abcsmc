[package]
name = "abcsmc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# Seeded StdRng only: no OS entropy, so no getrandom (which wasm32-unknown-unknown lacks).
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng"] }
rand_distr = "0.6.0"
rayon = "1.10"
# Densities only; sampling comes from rand_distr. No rand or nalgebra pulled in.
statrs = { version = "0.19", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"], optional = true }

# The terminal progress bar. Left out on wasm, where there is no terminal and
# it would import a clock from a JavaScript host.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
indicatif = "0.18.6"

[features]
# Deserialize RealPrior/IntPrior directly from type-tagged distribution
# documents (e.g. `{ "type": "Uniform", "a": 1.0, "b": 3.5 }`), so configs can
# declare priors without code-level wrappers.
serde = ["dep:serde"]

[dev-dependencies]
csv = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 3

# Built for wasm32-unknown-unknown by `plz wasm`; see tests/wasm_smoke.mjs.
[[example]]
name = "wasm_smoke"
crate-type = ["cdylib"]
