# Run tasks with: plz [taskname]
# Docs: https://plzplz.org/reference.html

[tasks.lint]
run_serial = [
  "cargo clippy --all-targets --all-features -- -D warnings",
  "cargo fmt --all --check",
]
fail_hook = { suggest_command = "plz fix" }
git_hook = "pre-commit"

[tasks.fix]
run_serial = [
  "cargo fmt --all",
  "cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged",
]

# The renewal example's tests only run when targeted explicitly.
[tasks.test]
run_serial = [
  "cargo test",
  "cargo test --features serde",
  "cargo test --example renewal",
]
git_hook = "pre-push"

# Builds a calibration for wasm32-unknown-unknown and runs it under Node with
# no host imports, so it fails on anything that needs a JavaScript host or
# traps at runtime. Needs `rustup target add wasm32-unknown-unknown`.
[tasks.wasm]
run_serial = [
  "cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings",
  "cargo build --release --example wasm_smoke --target wasm32-unknown-unknown",
  "node tests/wasm_smoke.mjs target/wasm32-unknown-unknown/release/examples/wasm_smoke.wasm",
]

[tasks.check]
run_serial = ["plz:lint", "plz:test", "plz:wasm", "plz:ui:lint", "plz:ui:unit", "plz:ui:build"]

# Runs the renewal example and writes examples/output/{particles,trajectories}.csv
[tasks.renewal]
run = "cargo run --release --example renewal"

[taskgroup.ui.extends]
env = "pnpm"
dir = "viewer"

[taskgroup.ui.setup]
run = "pnpm install"

# Vite dev server for the run viewer
[taskgroup.ui.dev]
depends = ["ui.setup"]
run = "vite"

[taskgroup.ui.build]
depends = ["ui.setup"]
run_serial = ["vue-tsc -b", "vite build"]

[taskgroup.ui.unit]
depends = ["ui.setup"]
run = "vitest run"

[taskgroup.ui.e2e]
depends = ["ui.setup"]
run = "playwright test"

[taskgroup.ui.lint]
depends = ["ui.setup"]
run = "prettier --check ."

[taskgroup.ui.format]
depends = ["ui.setup"]
run = "prettier --write ."
